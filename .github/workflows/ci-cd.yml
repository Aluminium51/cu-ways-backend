name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, edited, synchronize, reopened]

jobs:
  governance:
    name: PR title and commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PR title and commit subjects
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([A-Za-z0-9._/-]+\))?!?: .+'

          validate_subject() {
            local label="$1"
            local subject="$2"

            if [[ "$subject" =~ $pattern || "$subject" =~ ^Revert\  ]]; then
              echo "$label: $subject"
              return
            fi

            echo "Invalid $label: $subject"
            echo "Use <type>: <description> or <type>(<scope>): <description>."
            echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert."
            exit 1
          }

          validate_subject "PR title" "$PR_TITLE"

          while IFS= read -r commit_sha; do
            [[ -z "$commit_sha" ]] && continue
            commit_subject="$(git show --quiet --format=%s "$commit_sha")"
            validate_subject "commit $commit_sha" "$commit_subject"
          done < <(git rev-list --no-merges --reverse "$BASE_SHA..$HEAD_SHA")

  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: cuways_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d cuways_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/cuways_test?sslmode=disable
        run: |
          go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3 \
            -path ./migrations \
            -database "$DATABASE_URL" up

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/cuways_test?sslmode=disable
          SECRET_KEY: test-secret-key-for-ci
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Check build targets
        run: |
          go build -v -o /dev/null ./cmd/api
          go build -v -o /dev/null ./cmd/seed-admin
