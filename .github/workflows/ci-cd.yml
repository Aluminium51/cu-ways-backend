name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ----------------------------------------------------
  # 1. Lint & Static Analysis
  # ----------------------------------------------------
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # ----------------------------------------------------
  # 2. Automated Tests (Unit & Integration Tests)
  # ----------------------------------------------------
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: cuways_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d cuways_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/cuways_test?sslmode=disable
        run: |
          go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3 \
            -path ./migrations \
            -database "$DATABASE_URL" up

      - name: Run Tests with Coverage
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/cuways_test?sslmode=disable
          SECRET_KEY: test-secret-key-for-ci
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Check Build Targets
        run: |
          go build -v -o /dev/null ./cmd/api
          go build -v -o /dev/null ./cmd/seed-admin

  # ----------------------------------------------------
  # 3. Build & Push Docker Image
  # ----------------------------------------------------
  build-and-push:
    name: Build & Push Docker Image
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------
  # 4. Continuous Deployment (CD)
  # ----------------------------------------------------
  deploy:
    name: Deploy to Server
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (for migration files)
        uses: actions/checkout@v4

      - name: Run Database Migrations
        run: |
          # ติดตั้ง golang-migrate CLI และรัน Migration ก่อนเริ่ม Container ใหม่
          set -euo pipefail
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.18.3/migrate.linux-amd64.tar.gz | tar xvz
          ./migrate -path migrations/ -database "${{ secrets.PROD_DATABASE_URL }}" up

      - name: Deploy Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # Restart Application Container
            docker stop cu-ways-api || true
            docker rm cu-ways-api || true
            docker run -d \
              --name cu-ways-api \
              --restart unless-stopped \
              --network host \
              --env-file /etc/cu-ways/.env \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest