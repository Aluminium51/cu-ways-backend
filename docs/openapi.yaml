openapi: 3.0.3
info:
  title: CU Ways API
  version: 0.1.0
  description: CU Ways backend API for authentication, users, marketer profiles and search, services, and survey metadata.
servers:
  - url: http://localhost:8081
tags:
  - name: Authentication
    description: Public account registration and login.
  - name: Users
    description: User profile management and administration.
  - name: Marketers
    description: Marketer profiles, services, and creator-facing search.
  - name: Surveys
    description: Survey metadata management.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process health
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                status: success
                data:
                  status: ok
  /readyz:
    get:
      operationId: getReadiness
      summary: Dependency readiness
      responses:
        '200':
          description: The application can reach PostgreSQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                status: success
                data:
                  status: ready
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error:
                  code: database_unavailable
                  message: service is not ready
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register an account
      description: Creates a user account with the default user role, provisions the user's Creator membership atomically, and returns a one-hour access token. The role cannot be supplied by the client.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Jane Doe
              email: jane@example.com
              password: correct horse battery staple
              phone: null
              line_id: jane.line
      responses:
        '201':
          description: Account created and access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in with email and password
      description: Returns a one-hour bearer access token. The API intentionally uses the same error for an unknown email and an incorrect password.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: jane@example.com
              password: correct horse battery staple
      responses:
        '200':
          description: Login succeeded and an access token was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Email or password is invalid, or the account is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List active users
      description: Administrator access is required. Soft-deleted users are excluded.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: One-based page number.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Number of users per page.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated user list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Query parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        description: Numeric user ID.
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      operationId: getUser
      summary: Get a user by ID
      description: The user may access their own profile; administrators may access any active profile.
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller cannot access this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User does not exist or was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: User ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateUser
      summary: Update a user profile
      description: The user may update their own profile; administrators may update any active profile. Omitted fields are unchanged and null phone/line_id values clear those fields.
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller cannot update this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User does not exist or was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteUser
      summary: Soft-delete a user
      description: The user may delete their own profile; administrators may delete any active profile.
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User was soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller cannot delete this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User does not exist or was already deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: User ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/marketer-profile:
    get:
      operationId: getMyMarketerProfile
      summary: Get my marketer profile
      tags: [Marketers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Marketer profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketerProfileResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The authenticated user has no marketer profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: saveMyMarketerProfile
      summary: Create or replace my marketer profile
      description: Core profile fields are required on every save. Expertise and campus arrays may be empty.
      tags: [Marketers]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketerProfileRequest'
            example:
              bio: Experienced survey researcher specializing in data collection and report preparation.
              experience_years: 3
              availability_status: available
              availability_text: Available on weekdays from 09:00 to 17:00.
              expertise:
                - data-collection
                - report-preparation
              campuses:
                - cu-main-campus
                - online-remote
      responses:
        '200':
          description: Marketer profile saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketerProfileResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Profile or catalog values are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/services:
    get:
      operationId: listMyServices
      summary: List my services
      tags: [Marketers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Services owned by the authenticated marketer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A marketer profile is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createMyService
      summary: Create a service
      tags: [Marketers]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Service created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A marketer profile is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/services/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    patch:
      operationId: updateMyService
      summary: Update my service
      tags: [Marketers]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: Service updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A marketer profile is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Service not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteMyService
      summary: Delete my service
      tags: [Marketers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Service deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteServiceResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A marketer profile is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Service not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/statistics:
    get:
      operationId: getMyMarketerStatistics
      summary: Get my completed-job statistics
      description: Returns statistics for completed jobs whose accepted offer belongs to the authenticated marketer. Earnings include only paid payments, and the average excludes jobs without a review.
      tags: [Marketers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Marketer performance statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketerStatisticsResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A marketer profile is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/marketers:
    get:
      operationId: searchMarketers
      summary: Search marketer profiles
      description: Creator and administrator callers can combine all filters. Multiple expertise and campus values are matched with AND semantics. Ratings use only 1-5 reviews for completed jobs.
      tags: [Marketers]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: min_price
          in: query
          schema:
            type: number
            format: decimal
            minimum: 0
        - name: max_price
          in: query
          schema:
            type: number
            format: decimal
            minimum: 0
        - name: expertise
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
            example: [data-collection, report-preparation]
        - name: campus
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: min_rating
          in: query
          schema:
            type: number
            format: double
            minimum: 1
            maximum: 5
        - name: min_experience_years
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 80
        - name: availability_status
          in: query
          schema:
            type: string
            enum: [available, limited, unavailable]
        - name: sort
          in: query
          description: Defaults to lowest matching service price, then rating.
          schema:
            type: string
            enum: [price_asc, rating_desc]
            default: price_asc
      responses:
        '200':
          description: Paginated marketer search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketerSearchResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A creator profile or administrator role is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Search parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/surveys:
    post:
      operationId: createSurvey
      summary: Create a survey
      description: Creates a survey for the authenticated Creator. Registration provisions Creator membership immediately; this operation also uses an idempotent membership insert for existing or legacy accounts.
      tags: [Surveys]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSurveyRequest'
      responses:
        '201':
          description: Survey created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/surveys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      operationId: getSurvey
      summary: Get a survey
      tags: [Surveys]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Survey metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller does not own this survey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Survey not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateSurvey
      summary: Update survey metadata
      description: Omitted fields are unchanged. Title and survey_link cannot be null or empty when supplied.
      tags: [Surveys]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSurveyRequest'
      responses:
        '200':
          description: Survey updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller does not own this survey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Survey not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteSurvey
      summary: Delete a survey
      description: A survey cannot be deleted when any is_used_in row references it, regardless of job status.
      tags: [Surveys]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Survey deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSurveyResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller does not own this survey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Survey not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Survey is referenced by a job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        phone:
          type: string
          nullable: true
          maxLength: 20
        line_id:
          type: string
          nullable: true
          maxLength: 50
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    AuthenticatedUser:
      allOf:
        - $ref: '#/components/schemas/User'
    AuthResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [access_token, token_type, expires_in, user]
          properties:
            access_token:
              type: string
            token_type:
              type: string
              enum: [Bearer]
            expires_in:
              type: integer
              format: int64
              example: 3600
            user:
              $ref: '#/components/schemas/AuthenticatedUser'
    User:
      type: object
      required: [user_id, name, email, phone, line_id, created_at]
      properties:
        user_id:
          type: integer
          format: int32
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          nullable: true
          maxLength: 20
        line_id:
          type: string
          nullable: true
          maxLength: 50
        created_at:
          type: string
          format: date-time
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          nullable: true
          maxLength: 20
        line_id:
          type: string
          nullable: true
          maxLength: 50
    UserResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          $ref: '#/components/schemas/User'
    UserListResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [items, page, page_size, total]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/User'
            page:
              type: integer
              format: int32
            page_size:
              type: integer
              format: int32
            total:
              type: integer
              format: int64
    DeleteUserResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [user_id, deleted]
          properties:
            user_id:
              type: integer
              format: int32
            deleted:
              type: boolean
    MarketerProfileRequest:
      type: object
      required: [bio, experience_years, availability_status, availability_text]
      properties:
        bio:
          type: string
