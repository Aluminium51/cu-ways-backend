openapi: 3.0.3
info:
  title: CU Ways API
  version: 0.1.0
  description: CU Ways backend API for authentication, users, marketer profiles and search, services, survey metadata, and Creator job setup.
servers:
  - url: http://localhost:8081
tags:
  - name: Authentication
    description: Public account registration and login.
  - name: Users
    description: User profile management and administration.
  - name: Marketers
    description: Marketer profiles, services, and creator-facing search.
  - name: Surveys
    description: Survey metadata management.
  - name: Jobs
    description: Creator job setup, survey links, briefs, marketer invitations, offer comparison, and offer acceptance.
  - name: Job Requests
    description: Marketer review of and responses to job invitations, and offer submission.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process health
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                status: success
                data:
                  status: ok
  /readyz:
    get:
      operationId: getReadiness
      summary: Dependency readiness
      responses:
        '200':
          description: The application can reach PostgreSQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                status: success
                data:
                  status: ready
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error:
                  code: database_unavailable
                  message: service is not ready
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register an account
      description: Creates a user account with the default user role, provisions the user's Creator membership atomically, and returns a one-hour access token. The role cannot be supplied by the client.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Jane Doe
              email: jane@example.com
              password: correct horse battery staple
              phone: null
              line_id: jane.line
      responses:
        '201':
          description: Account created and access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in with email and password
      description: Returns a one-hour bearer access token. The API intentionally uses the same error for an unknown email and an incorrect password.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: jane@example.com
              password: correct horse battery staple
      responses:
        '200':
          description: Login succeeded and an access token was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Email or password is invalid, or the account is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List active users
      description: Administrator access is required. Soft-deleted users are excluded.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: One-based page number.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Number of users per page.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated user list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Query parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        description: Numeric user ID.
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      operationId: getUser
      summary: Get a user by ID
      description: The user may access their own profile; administrators may access any active profile.
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller cannot access this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User does not exist or was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: User ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateUser
      summary: Update a user profile
      description: The user may update their own profile; administrators may update any active profile. Omitted fields are unchanged and null phone/line_id values clear those fields.
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller cannot update this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User does not exist or was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteUser
      summary: Soft-delete a user
      description: The user may delete their own profile; administrators may delete any active profile.
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User was soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller cannot delete this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User does not exist or was already deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: User ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/marketer-profile:
    get:
      operationId: getMyMarketerProfile
      summary: Get my marketer profile
      tags: [Marketers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Marketer profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketerProfileResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The authenticated user has no marketer profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: saveMyMarketerProfile
      summary: Create or replace my marketer profile
      description: Core profile fields are required on every save. Expertise and campus arrays may be empty.
      tags: [Marketers]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketerProfileRequest'
            example:
              bio: Experienced survey researcher specializing in data collection and report preparation.
              experience_years: 3
              availability_status: available
              availability_text: Available on weekdays from 09:00 to 17:00.
              expertise:
                - data-collection
                - report-preparation
              campuses:
                - cu-main-campus
                - online-remote
      responses:
        '200':
          description: Marketer profile saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketerProfileResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Profile or catalog values are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/services:
    get:
      operationId: listMyServices
      summary: List my services
      tags: [Marketers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Services owned by the authenticated marketer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A marketer profile is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createMyService
      summary: Create a service
      tags: [Marketers]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Service created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A marketer profile is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/services/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    patch:
      operationId: updateMyService
      summary: Update my service
      tags: [Marketers]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: Service owned by the authenticated marketer was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A marketer profile is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Service is missing, removed, or owned by another marketer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteMyService
      summary: Delete my service
      tags: [Marketers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Service owned by the authenticated marketer was soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteServiceResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A marketer profile is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Service is missing, removed, or owned by another marketer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/statistics:
    get:
      operationId: getMyMarketerStatistics
      summary: Get my completed-job statistics
      description: Returns statistics for completed jobs whose accepted offer belongs to the authenticated marketer. Earnings include only paid payments, and the average excludes jobs without a review.
      tags: [Marketers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Marketer performance statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketerStatisticsResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A marketer profile is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/marketers:
    get:
      operationId: searchMarketers
      summary: Search marketer profiles
      description: Creator and administrator callers can combine all filters. Multiple expertise and campus values are matched with AND semantics. Ratings use only 1-5 reviews for completed jobs.
      tags: [Marketers]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: keyword
          in: query
          description: Case-insensitive partial match against the marketer's name, bio, or any of their non-deleted services' type/scope text. A marketer with multiple matching services still appears once.
          schema:
            type: string
            maxLength: 100
        - name: min_price
          in: query
          schema:
            type: number
            format: decimal
            minimum: 0
        - name: max_price
          in: query
          schema:
            type: number
            format: decimal
            minimum: 0
        - name: expertise
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
            example: [data-collection, report-preparation]
        - name: campus
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: min_rating
          in: query
          schema:
            type: number
            format: double
            minimum: 1
            maximum: 5
        - name: min_experience_years
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 80
        - name: availability_status
          in: query
          schema:
            type: string
            enum: [available, limited, unavailable]
        - name: sort
          in: query
          description: Sort by matching service price or completed-job rating. NULL prices and ratings are always placed last; ties are resolved by marketer name (case-sensitive, ascending), then by user ID ascending as a final deterministic fallback for marketers sharing the same name. Defaults to lowest matching service price.
          schema:
            type: string
            enum: [price_asc, price_desc, rating_asc, rating_desc]
            default: price_asc
      responses:
        '200':
          description: Paginated marketer search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketerSearchResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A creator profile or administrator role is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Search parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/marketers/{id}:
    get:
      operationId: getMarketerDetail
      summary: Get a marketer's detailed profile
      description: Returns the marketer profile, active service listings, completed-job count, and average rating. Completed jobs are matched through the marketer's accepted offers. The average uses only ratings from 1 to 5 and is null when no qualifying review exists.
      tags: [Marketers]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: Detailed marketer profile and verified performance summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketerDetailResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A creator profile or administrator role is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The marketer profile does not exist or belongs to a deleted user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/surveys:
    post:
      operationId: createSurvey
      summary: Create a survey
      description: Creates a survey for the authenticated Creator. Registration provisions Creator membership immediately; this operation also uses an idempotent membership insert for existing or legacy accounts.
      tags: [Surveys]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSurveyRequest'
      responses:
        '201':
          description: Survey created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/surveys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      operationId: getSurvey
      summary: Get a survey
      tags: [Surveys]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Survey metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller does not own this survey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Survey not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateSurvey
      summary: Update survey metadata
      description: Omitted fields are unchanged. Title and survey_link cannot be null or empty when supplied.
      tags: [Surveys]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSurveyRequest'
      responses:
        '200':
          description: Survey updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller does not own this survey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Survey not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteSurvey
      summary: Delete a survey
      description: A survey cannot be deleted when any is_used_in row references it, regardless of job status.
      tags: [Surveys]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Survey deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSurveyResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller does not own this survey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Survey not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Survey is referenced by a job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/surveys:
    get:
      operationId: listMySurveysForJobs
      summary: List surveys owned by the authenticated Creator
      tags: [Jobs]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The Creator's surveys, newest first. An empty list is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyListResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller does not have Creator membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs:
    post:
      operationId: createJob
      summary: Create a Pending job with one or more owned surveys
      description: Creates the job and all is_used_in rows atomically. survey_ids must be non-empty, unique, and owned by the authenticated Creator. The accepted offer remains null.
      tags: [Jobs]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job and survey links created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Creator membership or selected a survey they do not own.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: One or more selected surveys do not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request contains no surveys, invalid IDs, or duplicate IDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/jobs:
    get:
      operationId: listMyJobs
      summary: List jobs owned by the authenticated Creator
      description: Jobs are ordered by created_at descending and then job_id descending. Each job includes its linked survey IDs and titles, ordered by survey_id ascending. An empty list is valid.
      tags: [Jobs]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The Creator's job summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorJobSummaryListResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller does not have active Creator membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      operationId: getJob
      summary: Get a Creator-owned job summary
      description: Returns the job's linked surveys ordered by survey_id ascending. The authenticated user must have active Creator membership and own the job.
      tags: [Jobs]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The job summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorJobSummaryResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller does not have active Creator membership or does not own the job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The job ID is not a positive int32.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs/{id}/surveys/{surveyId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: surveyId
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    post:
      operationId: addSurveyToJob
      summary: Link an owned survey to an owned job
      tags: [Jobs]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Survey linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobLinkResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller does not own the job or survey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job or survey not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Survey is already linked to the job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: removeSurveyFromJob
      summary: Unlink a survey while keeping at least one survey on the job
      tags: [Jobs]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Survey unlinked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobLinkResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller does not own the job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found or survey is not linked to it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Removing this survey would leave the job with no surveys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs/{id}/briefs:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      operationId: listJobBriefs
      summary: List current and historical brief URLs for a job
      description: Results are ordered newest first; the first brief is current. Older brief records are retained.
      tags: [Jobs]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Brief attachment history. An empty list is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefListResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller does not own the job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: addJobBrief
      summary: Save a new brief URL for an owned job
      description: Adds an attachment_type Brief row with a server-generated timestamp. Previous briefs remain available as history.
      tags: [Jobs]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBriefRequest'
      responses:
        '201':
          description: Brief saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller does not own the job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: URL must be an absolute HTTP or HTTPS URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs/{id}/requests:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    post:
      operationId: createJobRequests
      summary: Invite marketers to make offers on a job
      description: Creates one Pending request per selected marketer atomically. Pending and Accepted requests count as active; declined and closed requests remain in history and allow a later invitation.
      tags: [Jobs]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequestsRequest'
      responses:
        '201':
          description: Requests created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRequestListResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller does not own the job or lacks Creator membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An active request already exists for a selected marketer (code job_conflict), or the job has already hired a marketer (code job_not_pending).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request is empty, contains duplicate IDs, or selects an unavailable marketer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: listJobRequests
      summary: List invitation history for a Creator-owned job
      description: Includes all request statuses, newest first by created_at and then job_request_id. Responses include marketer names only and do not expose contact or profile details. The authenticated user must have active Creator membership and own the job.
      tags: [Jobs]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The job's invitation history. An empty list is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentJobRequestListResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller does not have active Creator membership or does not own the job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The job ID is not a positive int32.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs/{id}/offers:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      operationId: listJobOffers
      summary: Compare the offers submitted for a job
      description: Returns every offer on a job the caller owns, oldest first, with the marketer's profile and rating history. The rating uses the same rule as the marketer detail endpoint - jobs count when Completed through the marketer's accepted offer, and only 1-5 reviews contribute to average_rating. Marketers with no rated jobs return average_rating null and is_rated false.
      tags: [Jobs]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Pending, Accepted, Rejected, Withdrawn]
      responses:
        '200':
          description: Offers for the job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferComparisonListResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Creator membership (code creator_required) or does not own the job (code forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found (code job_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid job ID or unknown status filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs/{id}/offers/{offerId}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: offerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    post:
      operationId: acceptJobOffer
      summary: Accept one offer and hire its marketer
      description: In one transaction that rolls back completely on any failure, marks the job Accepted with accepted_offer_id, sets the offer to Accepted, sets every other Pending offer on the job to Rejected, and closes the other marketers' Pending or Accepted job requests. The hired marketer's request stays Accepted. Only a Pending offer on a Pending job can be accepted.
      tags: [Jobs]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Offer accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptOfferResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Creator membership (code creator_required) or does not own the job (code forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found (code job_not_found) or the offer does not belong to the job (code offer_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The job already has an accepted offer or is closed (code job_not_pending), or the offer is not Pending (code offer_not_pending).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid job or offer ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/job-requests:
    get:
      operationId: listMyJobRequests
      summary: List job requests sent to the authenticated marketer
      description: Returns the requests addressed to the caller, newest first, with the job context needed to decide on each one. The job deadline is the earliest linked survey deadline and target_responses sums the linked surveys' desired responses; either is null when no survey sets it. The brief is the newest Brief attachment.
      tags: [Job Requests]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Pending, Accepted, Declined, Closed]
      responses:
        '200':
          description: Requests addressed to the marketer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketerJobRequestListResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Marketer membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The status filter is not a known request status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/job-requests/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    post:
      operationId: acceptMyJobRequest
      summary: Accept a pending job request
      description: Moves a Pending request addressed to the caller to Accepted and records responded_at. Accepting signals interest so the marketer can submit an offer; it does not hire the marketer or change the job status.
      tags: [Job Requests]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRequestResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Marketer membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No request with this ID is addressed to the caller (code job_request_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The request is no longer Pending (code job_request_not_pending).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/job-requests/{id}/decline:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    post:
      operationId: declineMyJobRequest
      summary: Decline a pending job request
      description: Moves a Pending request addressed to the caller to Declined and records responded_at. The body is optional; blank reason or note values are stored as null. A declined request stays in history and allows a later invitation.
      tags: [Job Requests]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineJobRequestRequest'
      responses:
        '200':
          description: Request declined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRequestResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Marketer membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No request with this ID is addressed to the caller (code job_request_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The request is no longer Pending (code job_request_not_pending).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unknown decline reason, a note longer than 300 characters, or unknown body fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/job-requests/{id}/offers:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      operationId: listMyJobRequestOffers
      summary: List the marketer's offers for a job request
      description: Returns the caller's offers for one request, newest first. The first item is the current offer; withdrawn and rejected offers remain as history.
      tags: [Job Requests]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Offers for the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferListResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Marketer membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No request with this ID is addressed to the caller (code job_request_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: submitMyJobRequestOffer
      summary: Submit a price offer for an accepted job request
      description: Creates a Pending offer for a request the caller has Accepted. A request may have only one active (Pending or Accepted) offer; a Withdrawn or Rejected offer allows a new one. The price is a non-negative decimal string with at most two decimal places, up to 99999999.99; zero is valid. The delivery date is a YYYY-MM-DD date that cannot be before today or after the job deadline (the earliest linked survey deadline), using the Asia/Bangkok calendar.
      tags: [Job Requests]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOfferRequest'
      responses:
        '201':
          description: Offer submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Marketer membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No request with this ID is addressed to the caller (code job_request_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The job has already hired a marketer (code job_not_pending), the request is not Accepted (code job_request_not_accepted), or it already has an active offer (code offer_already_exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Malformed body (code validation_error) or an invalid price, delivery date, or message (code invalid_offer; the message names the problem).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/offers/{id}/withdraw:
    post:
      operationId: withdrawMyOffer
      summary: Withdraw the marketer's pending offer
      description: >-
        Changes only the authenticated marketer's Pending offer to Withdrawn and
        returns the updated offer. No request body is required. The offer remains
        in history with its original price, delivery date, message, and creation
        time. The job and invitation are unchanged. A new offer can be submitted
        through POST /api/v1/me/job-requests/{id}/offers while that invitation is
        Accepted, the job is Pending, and no Pending or Accepted offer exists.
        Withdrawal and acceptance serialize on the offer row; whichever obtains
        that lock first wins, and the other action returns offer_not_pending.
      tags: [Job Requests]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The offer ID, not the job request ID.
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: Offer withdrawn; offer_status is Withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Marketer membership (code marketer_profile_required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The offer does not exist or belongs to another marketer (code offer_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The offer is Accepted, Rejected, or already Withdrawn (code offer_not_pending). No state is changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The offer ID is not a positive int32 (code validation_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, phone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        phone:
          type: string
          description: A 10-digit Thai mobile number, digits only. Must be unique across accounts.
          pattern: '^[0-9]{10}$'
          minLength: 10
          maxLength: 10
        line_id:
          type: string
          nullable: true
          maxLength: 50
        marketer_profile:
          $ref: '#/components/schemas/RegisterMarketerProfile'
    RegisterMarketerProfile:
      type: object
      description: >-
        Sent only when signing up as a Marketer. The account also keeps its Creator
        membership. Availability status starts as `available`; expertise and campuses
        are added later from the marketer profile.
      properties:
        bio:
          type: string
          maxLength: 5000
        experience_years:
          type: integer
          format: int32
          minimum: 0
          maximum: 80
        availability_text:
          type: string
          maxLength: 5000
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    AuthenticatedUser:
      allOf:
        - $ref: '#/components/schemas/User'
    AuthResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [access_token, token_type, expires_in, user]
          properties:
            access_token:
              type: string
            token_type:
              type: string
              enum: [Bearer]
            expires_in:
              type: integer
              format: int64
              example: 3600
            user:
              $ref: '#/components/schemas/AuthenticatedUser'
    User:
      type: object
      required: [user_id, name, email, phone, line_id, created_at]
      properties:
        user_id:
          type: integer
          format: int32
        name:
          type: string
          maxLength: 100
