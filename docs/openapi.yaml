              type: string
              description: Amount formatted with exactly two decimal places.
              example: '1500.00'
            payment_status:
              type: string
              enum: [Paid]
            created_at:
              type: string
              format: date-time
              description: Creation time assigned by the server in UTC.
            paid_at:
              type: string
              format: date-time
              description: Server-generated UTC time of the Creator's confirmation.
    CurrentReviewResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [review]
          properties:
            review:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/JobReview'
    JobReview:
      type: object
      required: [review_id, job_id, rating, comment, created_at]
      properties:
        review_id:
          type: integer
          format: int32
        job_id:
          type: integer
          format: int32
        rating:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          description: 1-5 stars. 0 can appear only on legacy reviews created before the 1-5 rule.
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          description: Server-assigned UTC submission time.
    ReviewResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [review_id, job_id, rating, comment, created_at]
          properties:
            review_id:
              type: integer
              format: int32
            job_id:
              type: integer
              format: int32
            rating:
              type: integer
              format: int32
              minimum: 1
              maximum: 5
            comment:
              type: string
              nullable: true
            created_at:
              type: string
              format: date-time
    JobPayment:
      type: object
      required: [payment_id, job_id, method, amount, payment_status, created_at, paid_at]
      properties:
        payment_id:
          type: integer
          format: int32
        job_id:
          type: integer
          format: int32
        method:
          type: string
          enum: [PromptPay, Bank Transfer, Credit Card, Other]
        amount:
          type: string
          description: Amount formatted with exactly two decimal places.
          example: '1500.00'
        payment_status:
          type: string
          enum: [Paid]
        created_at:
          type: string
          format: date-time
          nullable: true
          description: Creation time assigned by the server in UTC.
        paid_at:
          type: string
          format: date-time
          nullable: true
          description: Server-generated UTC time of the Creator's confirmation.
    JobSettlement:
      type: object
      required: [job_id, job_title, job_status, creator, marketer, accepted_price, payment, payout_status, completed_at]
      properties:
        job_id:
          type: integer
          format: int32
        job_title:
          type: string
        job_status:
          type: string
          enum: [Pending, Accepted, In Progress, Completed, Cancelled]
        creator:
          $ref: '#/components/schemas/TransactionParty'
        marketer:
          $ref: '#/components/schemas/TransactionParty'
        contact:
          $ref: '#/components/schemas/JobContact'
        accepted_price:
          type: string
        payment:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/JobPayment'
        payout_status:
          type: string
          nullable: true
          enum: [Held, Released, null]
        completed_at:
          type: string
          format: date-time
          nullable: true
    JobSettlementEnvelope:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          $ref: '#/components/schemas/JobSettlement'
    MarketerRating:
      type: object
      required: [average_rating, review_count, completed_jobs, is_rated]
      properties:
        average_rating:
          type: number
          format: double
          nullable: true
        review_count:
          type: integer
          format: int64
        completed_jobs:
          type: integer
          format: int64
        is_rated:
          type: boolean
    JobOfferComparison:
      allOf:
        - $ref: '#/components/schemas/Offer'
        - type: object
          required: [marketer, rating]
          properties:
            marketer:
              $ref: '#/components/schemas/MarketerProfile'
            rating:
              $ref: '#/components/schemas/MarketerRating'
    JobOfferComparisonListResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: array
          items:
            $ref: '#/components/schemas/JobOfferComparison'
    StartJobResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [job_id, job_status, accepted_offer_id, offer]
          properties:
            job_id:
              type: integer
              format: int32
            job_status:
              type: string
              enum: [In Progress]
            accepted_offer_id:
              type: integer
              format: int32
            offer:
              $ref: '#/components/schemas/Offer'
    AcceptOfferResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [job_id, job_status, accepted_offer_id, offer, rejected_offer_ids, closed_job_request_ids]
          properties:
            job_id:
              type: integer
              format: int32
            job_status:
              type: string
              enum: [Accepted]
            accepted_offer_id:
              type: integer
              format: int32
            offer:
              $ref: '#/components/schemas/Offer'
            rejected_offer_ids:
              type: array
              items:
                type: integer
                format: int32
            closed_job_request_ids:
              type: array
              items:
                type: integer
                format: int32
    CancelJobRequest:
      type: object
      additionalProperties: false
      properties:
        cancel_reason:
          type: string
          nullable: true
          maxLength: 300
          description: Optional reason, trimmed by the server. Blank is stored as null.
    CancelJobResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [job_id, job_status, cancelled_at, cancel_reason, closed_job_request_ids, rejected_offer_ids]
          properties:
            job_id:
              type: integer
              format: int32
            job_status:
              type: string
              enum: [Cancelled]
            cancelled_at:
              type: string
              format: date-time
            cancel_reason:
              type: string
              nullable: true
            closed_job_request_ids:
              type: array
              items:
                type: integer
                format: int32
            rejected_offer_ids:
              type: array
              items:
                type: integer
                format: int32
    MarketerJobRequestListResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: array
          items:
            $ref: '#/components/schemas/MarketerJobRequest'
    JobRequestListResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: array
          items:
            $ref: '#/components/schemas/JobRequest'
    SentJobRequest:
      type: object
      required: [job_request_id, job_id, marketer_id, request_status, created_at, responded_at, marketer_name]
      properties:
        job_request_id:
          type: integer
          format: int32
        job_id:
          type: integer
          format: int32
        marketer_id:
          type: integer
          format: int32
        request_status:
          type: string
          enum: [Pending, Accepted, Declined, Closed]
        created_at:
          type: string
          format: date-time
        responded_at:
          type: string
          format: date-time
          nullable: true
        marketer_name:
          type: string
    SentJobRequestListResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: array
          items:
            $ref: '#/components/schemas/SentJobRequest'
    DeleteSurveyResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [survey_id, deleted]
          properties:
            survey_id:
              type: integer
              format: int32
            deleted:
              type: boolean
    MarketerSearchResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [items, page, page_size, total]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MarketerSearchItem'
            page:
              type: integer
            page_size:
              type: integer
            total:
              type: integer
              format: int64
    MarketerSearchItem:
      type: object
      required: [profile, services, review_count]
      properties:
        profile:
          $ref: '#/components/schemas/MarketerProfile'
        lowest_matching_service_price:
          type: string
          nullable: true
        average_rating:
          type: number
          format: double
          nullable: true
        review_count:
          type: integer
          format: int64
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
    MarketerDetailResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [profile, services, total_completed_jobs, average_rating, review_count]
          properties:
            profile:
              $ref: '#/components/schemas/MarketerProfile'
            services:
              type: array
              description: Active service listings only.
              items:
                $ref: '#/components/schemas/Service'
            review_count:
              type: integer
              format: int64
              minimum: 0
            total_completed_jobs:
              type: integer
              format: int64
              minimum: 0
            average_rating:
              type: number
              format: double
              minimum: 1
              maximum: 5
              nullable: true
              description: Null when the marketer has no qualifying review on an accepted-offer completed job.
    MarketerReviewsResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [items, average_rating, review_count, page, page_size, total]
          properties:
            items:
              type: array
              description: One page of verified reviews, newest first. Empty when none qualify.
              items:
                type: object
                required: [review_id, job_id, reviewer_name, rating, comment, created_at]
                properties:
                  review_id:
                    type: integer
                    format: int32
                  job_id:
                    type: integer
                    format: int32
                  reviewer_name:
                    type: string
                    description: The current name of the Creator who owns the job.
                    example: Narin Chai
                  rating:
                    type: integer
                    format: int32
                    minimum: 1
                    maximum: 5
                  comment:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
            average_rating:
              type: number
              format: double
              minimum: 1
              maximum: 5
              nullable: true
              description: Mean rating over every qualifying review. Null when the marketer has no qualifying reviews.
            review_count:
              type: integer
              format: int64
              minimum: 0
              description: Total number of verified reviews across all pages.
            page:
              type: integer
              format: int32
              minimum: 1
            page_size:
              type: integer
              format: int32
              minimum: 1
            total:
              type: integer
              format: int64
              minimum: 0
              description: Total number of verified reviews matching the query; equal to review_count.
    SuccessResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
    ErrorResponse:
      type: object
      required: [status, error]
      properties:
        status:
          type: string
          enum: [error]
        error:
          $ref: '#/components/schemas/APIError'
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          nullable: true
