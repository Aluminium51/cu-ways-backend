      description: Includes all request statuses, newest first by created_at and then job_request_id. Responses include marketer names only and do not expose contact or profile details. The authenticated user must have active Creator membership and own the job.
      tags: [Jobs]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The job's invitation history. An empty list is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentJobRequestListResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller does not have active Creator membership or does not own the job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The job ID is not a positive int32.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs/{id}/offers:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      operationId: listJobOffers
      summary: Compare the offers submitted for a job
      description: Returns every offer on a job the caller owns, oldest first, with the marketer's profile and rating history. The rating uses the same rule as the marketer detail endpoint - jobs count when Completed through the marketer's accepted offer, and only 1-5 reviews contribute to average_rating. Marketers with no rated jobs return average_rating null and is_rated false.
      tags: [Jobs]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Pending, Accepted, Rejected, Withdrawn]
      responses:
        '200':
          description: Offers for the job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferComparisonListResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Creator membership (code creator_required) or does not own the job (code forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found (code job_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid job ID or unknown status filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs/{id}/offers/{offerId}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: offerId
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    post:
      operationId: acceptJobOffer
      summary: Accept one offer and hire its marketer
      description: In one transaction that rolls back completely on any failure, marks the job Accepted with accepted_offer_id, sets the offer to Accepted, sets every other Pending offer on the job to Rejected, and closes the other marketers' Pending or Accepted job requests. The hired marketer's request stays Accepted. Only a Pending offer on a Pending job can be accepted.
      tags: [Jobs]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Offer accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptOfferResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Creator membership (code creator_required) or does not own the job (code forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found (code job_not_found) or the offer does not belong to the job (code offer_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The job already has an accepted offer or is closed (code job_not_pending), or the offer is not Pending (code offer_not_pending).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid job or offer ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs/{id}/start:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    post:
      operationId: startJob
      summary: Start an accepted job as its hired marketer
      description: >-
        Moves an Accepted job to In Progress. No request body is required. Only
        the marketer who owns the job's accepted offer may start it, and that
        offer must still be Accepted. Ownership is checked
        before the job status, so other marketers cannot learn a job's state.
        The accepted offer is unchanged. The job is locked while starting, so
        only one of several concurrent starts succeeds.
      tags: [Jobs]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Job started; job_status is In Progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartJobResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Marketer membership (code marketer_profile_required), or the job has no accepted offer owned by the caller (code job_forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found (code job_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The job is not Accepted, for example already In Progress or Completed (code job_not_accepted), or its accepted offer is no longer Accepted (code accepted_offer_mismatch). No state is changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The job ID is not a positive int32 (code validation_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    post:
      operationId: cancelJob
      summary: Cancel a pending job
      description: >-
        Cancels an unpaid Pending, Accepted, or In Progress job owned by the caller so the incomplete contract is
        logged. The request body is optional. In one transaction that rolls back
        completely on any failure, the job becomes Cancelled with cancelled_at
        set by the server and the optional trimmed cancel_reason, every Pending
        or Accepted job request on the job is Closed, and every Pending offer is
        Rejected. Payments are not changed. Only Pending jobs can be cancelled,
        and a job with a Paid payment cannot be cancelled.
      tags: [Jobs]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelJobRequest'
      responses:
        '200':
          description: Job cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelJobResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Creator membership (code creator_required) or does not own the job (code forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found (code resource_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The job is already Cancelled (code job_already_cancelled), is Completed (code job_not_cancellable), or has a Paid payment (code job_has_paid_payment). No state is changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The job ID is not a positive int32 or the body is malformed or has unknown fields (code validation_error), or cancel_reason is longer than 300 characters (code invalid_cancel_reason).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs/{id}/reviews:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    post:
      operationId: submitJobReview
      summary: Submit a review for a completed Job
      description: The authenticated Creator must own the Job, and its status must be Completed. Only one review may be submitted for each Job. The server records created_at.
      tags: [Jobs]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              additionalProperties: false
              properties:
                rating:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
                  nullable: true
            example:
              rating: 5
              comment: Delivered the agreed work and kept us informed.
      responses:
        '201':
          description: Review created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Creator membership (code creator_required) or does not own the Job (code forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found (code job_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Job is not Completed (code job_not_completed) or already has a review (code review_already_exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid Job ID, rating, or JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs/{id}/reviews/current:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      operationId: getCurrentJobReview
      summary: Read a Job's review
      description: The caller must have Creator membership and own the Job. Returns the Job's review, or `review` as null when the Job has not been reviewed. A Job has at most one review because reviews.job_id is unique. It works for a Job in any status, so the Creator can see an existing review after a reload instead of the submission form.
      tags: [Jobs]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The Job's review, or null when there is none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentReviewResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing Creator membership (creator_required) or the caller does not own the Job (forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job was not found (job_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid Job ID (validation_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs/{id}/payments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      operationId: getJobPayment
      summary: Read the payment for the owning Creator or hired Marketer
      tags: [Jobs]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saved job data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSettlementEnvelope'
        '401':
          description: Authentication required.
        '403':
          description: Access denied.
        '404':
          description: Job not found.
        '409':
          description: Job has no accepted offer.
    post:
      operationId: createJobPayment
      summary: Record a Creator-confirmed payment for a Job
      description: The caller must have Creator membership and own the Job. The Job must be Accepted, In Progress, or Completed with a valid accepted offer. Amount must exactly match the accepted offer price. An existing Pending or Paid payment blocks creation; Failed and Refunded history is retained. The server saves Paid with created_at and paid_at set to the same UTC instant. This records the Creator's confirmation without processing money through a payment gateway or changing the Job status.
      tags: [Jobs]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            example:
              method: PromptPay
              amount: '1500.00'
      responses:
        '201':
          description: Creator-confirmed Paid payment recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing Creator membership (creator_required) or the caller does not own the Job (forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job was not found (job_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Job is not payable (job_not_payable), has no valid accepted offer (accepted_offer_required), or already has a Pending or Paid payment (payment_already_exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid ID, method, amount, or JSON body (validation_error), or amount does not equal the accepted offer price (payment_amount_mismatch). No payment is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs/{id}/payments/current:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      operationId: getCurrentJobPayment
      summary: Read a Job's active payment
      description: The caller must have Creator membership and own the Job. Returns the Job's active payment, meaning the Pending or Paid payment that blocks a new one, or `payment` as null when there is none. Failed and Refunded history is not returned. It works for a Job in any status, so the Creator can see whether a payment was already recorded, for example after a payment request whose result was unknown.
      tags: [Jobs]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The active payment, or null when the Job has none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentPaymentResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing Creator membership (creator_required) or the caller does not own the Job (forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job was not found (job_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid Job ID (validation_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs/{id}/complete:
    post:
      operationId: completeJob
      summary: Complete a paid job with proof as its owning Creator
      description: Sets the completion time and records simulated payout release. Repeating completion returns the saved state.
      tags: [Jobs]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: Completed job and payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSettlementEnvelope'
        '401':
          description: Authentication required.
        '403':
          description: Access denied.
        '404':
          description: Job not found.
        '409':
          description: Job, accepted offer, Paid payment, or proof does not meet completion requirements.
  /api/v1/me/transactions:
    get:
      operationId: listMyTransactions
      summary: List my transaction history
      description: Returns the financial breakdown of Completed jobs that have a Paid payment and in which the authenticated user is the owning Creator or the hired Marketer (the accepted offer's marketer). Another user's jobs are never returned, and no user id is accepted from the request. Results are ordered by newest completion first, with unknown completion dates last, then by job_id descending. paid_at records the payment time. has_review is supplied only on the Creator side. payout_status is derived rather than stored. Every listed job is Completed with a Paid payment (the Creator's confirmation of payment), so it is always Released, which means the simulated payout was recorded when the job completed. It does not confirm that the Marketer received money, and no money moves through a payment gateway.
      tags: [Jobs]
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          description: Limit the history to jobs owned as a Creator or jobs worked as the hired Marketer. Omit to list both.
          required: false
          schema:
            type: string
            enum: [creator, marketer]
        - name: keyword
          in: query
          description: Case-insensitive partial match against the job title, creator name, marketer name, and payment method, or an exact job number (for example 42 or #42). Percent and underscore characters are matched literally. Maximum 100 characters.
          required: false
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          description: One-based page number.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
            default: 1
        - name: page_size
          in: query
          description: Number of transactions per page.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: One page of transactions. items is an empty array when there are none, and total counts every match across pages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListEnvelope'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: role, keyword, page, or page_size is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/job-requests:
    get:
      operationId: listMyJobRequests
      summary: List job requests sent to the authenticated marketer
      description: Returns the requests addressed to the caller, newest first, with the job context needed to decide on each one. The effective deadline is the earliest available date across the saved job deadline and the deadlines of its linked surveys, or null if none is set. The target_responses field sums the linked surveys' desired responses and is null when no survey sets a target. The brief is the newest Brief attachment.
      tags: [Job Requests]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Pending, Accepted, Declined, Closed]
      responses:
        '200':
          description: Requests addressed to the marketer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketerJobRequestListResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Marketer membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The status filter is not a known request status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/job-requests/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    post:
      operationId: acceptMyJobRequest
      summary: Accept a pending job request
      description: Moves a Pending request addressed to the caller to Accepted and records responded_at. Accepting signals interest so the marketer can submit an offer; it does not hire the marketer or change the job status.
      tags: [Job Requests]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRequestResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Marketer membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No request with this ID is addressed to the caller (code job_request_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The request is no longer Pending (code job_request_not_pending).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/job-requests/{id}/decline:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    post:
      operationId: declineMyJobRequest
      summary: Decline a pending job request
      description: Moves a Pending request addressed to the caller to Declined and records responded_at. The body is optional; blank reason or note values are stored as null. A declined request stays in history and allows a later invitation.
      tags: [Job Requests]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineJobRequestRequest'
      responses:
        '200':
          description: Request declined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRequestResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Marketer membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No request with this ID is addressed to the caller (code job_request_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The request is no longer Pending (code job_request_not_pending).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unknown decline reason, a note longer than 300 characters, or unknown body fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/job-requests/{id}/offers:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      operationId: listMyJobRequestOffers
      summary: List the marketer's offers for a job request
      description: Returns the caller's offers for one request, newest first. The first item is the current offer; withdrawn and rejected offers remain as history.
      tags: [Job Requests]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Offers for the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferListResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Marketer membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No request with this ID is addressed to the caller (code job_request_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: submitMyJobRequestOffer
      summary: Submit a price offer for an accepted job request
      description: Creates a Pending offer for a request the caller has Accepted. A request may have only one active (Pending or Accepted) offer; a Withdrawn or Rejected offer allows a new one. The price is a non-negative decimal string with at most two decimal places, up to 99999999.99; zero is valid. The delivery date is a YYYY-MM-DD date that cannot be before today in the Asia/Bangkok calendar. When an effective deadline exists, the delivery date cannot be later than the earliest available date across the saved job deadline and the deadlines of its linked surveys.
      tags: [Job Requests]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOfferRequest'
            example:
              offered_price: '1500.00'
              delivery_date: '2099-12-31'
              message: I can recruit the requested students and provide a delivery summary.
      responses:
        '201':
          description: Offer submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Marketer membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No request with this ID is addressed to the caller (code job_request_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The job has already hired a marketer (code job_not_pending), the request is not Accepted (code job_request_not_accepted), or it already has an active offer (code offer_already_exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Malformed body (code validation_error) or an invalid price, delivery date, or message (code invalid_offer; the message names the problem).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/offers/{id}/withdraw:
    post:
      operationId: withdrawMyOffer
      summary: Withdraw the marketer's pending offer
      description: >-
        Changes only the authenticated marketer's Pending offer to Withdrawn and
        returns the updated offer. No request body is required. The offer remains
        in history with its original price, delivery date, message, and creation
        time. The job and invitation are unchanged. A new offer can be submitted
        through POST /api/v1/me/job-requests/{id}/offers while that invitation is
        Accepted, the job is Pending, and no Pending or Accepted offer exists.
        Withdrawal and acceptance serialize on the offer row; whichever obtains
        that lock first wins, and the other action returns offer_not_pending.
      tags: [Job Requests]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The offer ID, not the job request ID.
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: Offer withdrawn; offer_status is Withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Marketer membership (code marketer_profile_required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The offer does not exist or belongs to another marketer (code offer_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The offer is Accepted, Rejected, or already Withdrawn (code offer_not_pending). No state is changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The offer ID is not a positive int32 (code validation_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AdminJobPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, format: int64 }
        items:
          type: array
          items:
            type: object
            required: [job_id, creator_name, survey_titles, job_status, amount, payment_status, paid_at]
            properties:
              job_id: { type: integer, format: int32 }
              creator_name: { type: string }
              survey_titles: { type: array, items: { type: string } }
              job_status: { type: string, enum: [Pending, Accepted, In Progress, Completed, Cancelled] }
              amount: { type: string, nullable: true }
              payment_status: { type: string, nullable: true }
              paid_at: { type: string, format: date-time, nullable: true }
    FlaggedMarketerPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, format: int64 }
        items:
          type: array
          items:
            type: object
            required: [marketer_id, name, flagged_jobs, total_value, attachment_count]
            properties:
              marketer_id: { type: integer, format: int32 }
              name: { type: string }
              flagged_jobs: { type: integer, format: int64 }
              total_value: { type: string }
              attachment_count: { type: integer, format: int64 }
    JobContact:
      type: object
      required: [email, phone, line_id]
      properties:
        email: { type: string }
        phone: { type: string, nullable: true }
        line_id: { type: string, nullable: true }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        phone:
          type: string
          nullable: true
          description: Optional 10-digit Thai mobile number. Must be unique when provided.
          pattern: '^[0-9]{10}$'
          minLength: 10
          maxLength: 10
        line_id:
          type: string
          nullable: true
          maxLength: 50
        marketer_profile:
          $ref: '#/components/schemas/RegisterMarketerProfile'
    RegisterMarketerProfile:
      type: object
      description: >-
        Sent only when signing up as a Marketer. The account also keeps its Creator
        membership. Availability status starts as `available`; expertise and campuses
        are added later from the marketer profile.
      properties:
        bio:
          type: string
          maxLength: 5000
        experience_years:
          type: integer
          format: int32
          minimum: 0
          maximum: 80
        availability_text:
          type: string
          maxLength: 5000
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    AuthenticatedUser:
      allOf:
        - $ref: '#/components/schemas/User'
    AuthResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [access_token, token_type, expires_in, user]
          properties:
            access_token:
              type: string
            token_type:
              type: string
              enum: [Bearer]
            expires_in:
              type: integer
              format: int64
              example: 3600
            user:
              $ref: '#/components/schemas/AuthenticatedUser'
    User:
      type: object
      required: [user_id, name, email, phone, line_id, created_at]
      properties:
