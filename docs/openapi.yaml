openapi: 3.0.3
info:
  title: CU Ways API
  version: 0.1.0
  description: CU Ways backend API for authentication, users, marketer profiles and search, services, survey metadata, and Creator job setup.
servers:
  - url: /
tags:
  - name: Authentication
    description: Public account registration and login.
  - name: Users
    description: User profile management and administration.
  - name: Marketers
    description: Marketer profiles, services, and creator-facing search.
  - name: Surveys
    description: Survey metadata management.
  - name: Jobs
    description: Creator job setup, survey links, briefs, proof of delivery, marketer invitations, offer comparison, and offer acceptance.
  - name: Job Requests
    description: Marketer review of and responses to job invitations, and offer submission.
paths:
  /api/v1/admin/jobs:
    get:
      operationId: listAdminJobs
      summary: List jobs and payment records for an administrator
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100 } }
        - in: query
          name: status
          schema: { type: string, enum: [Pending, Accepted, In Progress, Completed, Cancelled] }
      responses:
        '200':
          description: Jobs ordered by descending ID
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status: { type: string, enum: [success] }
                  data: { $ref: '#/components/schemas/AdminJobPage' }
        '401': { description: Authentication required }
        '403': { description: Administrator access required }
        '422': { description: Invalid report filters or pagination }
  /api/v1/admin/flagged-marketers:
    get:
      operationId: listFlaggedMarketers
      summary: List marketers with two or more flagged jobs
      description: Counts hired jobs that were cancelled or completed with a rating below three stars.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Report ordered by flagged count and then accepted offer value, descending
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status: { type: string, enum: [success] }
                  data: { $ref: '#/components/schemas/FlaggedMarketerPage' }
        '401': { description: Authentication required }
        '403': { description: Administrator access required }
        '422': { description: Invalid pagination }
  /healthz:
    get:
      operationId: getHealth
      summary: Process health
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                status: success
                data:
                  status: ok
  /readyz:
    get:
      operationId: getReadiness
      summary: Dependency readiness
      responses:
        '200':
          description: The application can reach PostgreSQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                status: success
                data:
                  status: ready
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error:
                  code: database_unavailable
                  message: service is not ready
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register an account
      description: Creates a user account with the default user role, provisions the user's Creator membership atomically, and returns a one-hour access token. The role cannot be supplied by the client.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              creator:
                summary: Register a Creator
                description: Replace the sample email and phone with unused test values.
                value:
                  name: Demo Creator
                  email: demo.creator@example.test
                  password: demo-creator-password
                  phone: '0812345678'
                  line_id: demo.creator
              marketer:
                summary: Register a Marketer
                description: Replace the sample email and phone with unused test values.
                value:
                  name: Demo Marketer
                  email: demo.marketer@example.test
                  password: demo-marketer-password
                  phone: '0898765432'
                  marketer_profile:
                    bio: Survey recruitment and outreach
                    experience_years: 2
                    availability_text: Weekdays
      responses:
        '201':
          description: Account created and access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in with email and password
      description: Returns a one-hour bearer access token. The API intentionally uses the same error for an unknown email and an incorrect password.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: demo.creator@example.test
              password: demo-creator-password
      responses:
        '200':
          description: Login succeeded and an access token was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Email or password is invalid, or the account is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List active users
      description: Administrator access is required. Soft-deleted users are excluded.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: One-based page number.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Number of users per page.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated user list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Administrator access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Query parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        description: Numeric user ID.
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      operationId: getUser
      summary: Get a user by ID
      description: The user may access their own profile; administrators may access any active profile.
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller cannot access this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User does not exist or was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: User ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateUser
      summary: Update a user profile
      description: The user may update their own profile; administrators may update any active profile. Omitted fields are unchanged and null phone/line_id values clear those fields.
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller cannot update this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User does not exist or was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteUser
      summary: Soft-delete a user
      description: The user may delete their own profile; administrators may delete any active profile.
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User was soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller cannot delete this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User does not exist or was already deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: User ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/marketer-profile:
    get:
      operationId: getMyMarketerProfile
      summary: Get my marketer profile
      tags: [Marketers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Marketer profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketerProfileResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The authenticated user has no marketer profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: saveMyMarketerProfile
      summary: Create or replace my marketer profile
      description: Core profile fields are required on every save. Expertise and campus arrays may be empty.
      tags: [Marketers]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketerProfileRequest'
            example:
              bio: Experienced survey researcher specializing in data collection and report preparation.
              experience_years: 3
              availability_status: available
              availability_text: Available on weekdays from 09:00 to 17:00.
              expertise:
                - data-collection
                - report-preparation
              campuses:
                - cu-main-campus
                - online-remote
      responses:
        '200':
          description: Marketer profile saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketerProfileResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Profile or catalog values are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/services:
    get:
      operationId: listMyServices
      summary: List my services
      tags: [Marketers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Services owned by the authenticated marketer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A marketer profile is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createMyService
      summary: Create a service
      tags: [Marketers]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Service created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A marketer profile is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/services/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    patch:
      operationId: updateMyService
      summary: Update my service
      tags: [Marketers]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: Service owned by the authenticated marketer was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A marketer profile is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Service is missing, removed, or owned by another marketer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteMyService
      summary: Delete my service
      tags: [Marketers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Service owned by the authenticated marketer was soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteServiceResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A marketer profile is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Service is missing, removed, or owned by another marketer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/statistics:
    get:
      operationId: getMyMarketerStatistics
      summary: Get my completed-job statistics
      description: Returns statistics for completed jobs whose accepted offer belongs to the authenticated marketer. Earnings include only paid payments, and the average excludes jobs without a review.
      tags: [Marketers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Marketer performance statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketerStatisticsResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A marketer profile is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/marketers:
    get:
      operationId: searchMarketers
      summary: Search marketer profiles
      description: Creator and administrator callers can combine all filters. Multiple expertise and campus values are matched with AND semantics. Ratings use only 1-5 reviews for completed jobs.
      tags: [Marketers]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: keyword
          in: query
          description: Case-insensitive partial match against the marketer's name, bio, or any of their non-deleted services' type/scope text. A marketer with multiple matching services still appears once.
          schema:
            type: string
            maxLength: 100
        - name: min_price
          in: query
          schema:
            type: number
            format: decimal
            minimum: 0
        - name: max_price
          in: query
          schema:
            type: number
            format: decimal
            minimum: 0
        - name: expertise
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
            example: [data-collection, report-preparation]
        - name: campus
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: min_rating
          in: query
          schema:
            type: number
            format: double
            minimum: 1
            maximum: 5
        - name: min_experience_years
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 80
        - name: availability_status
          in: query
          schema:
            type: string
            enum: [available, limited, unavailable]
        - name: sort
          in: query
          description: Sort by matching service price or completed-job rating. NULL prices and ratings are always placed last; ties are resolved by marketer name (case-sensitive, ascending), then by user ID ascending as a final deterministic fallback for marketers sharing the same name. Defaults to lowest matching service price.
          schema:
            type: string
            enum: [price_asc, price_desc, rating_asc, rating_desc]
            default: price_asc
      responses:
        '200':
          description: Paginated marketer search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketerSearchResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A creator profile or administrator role is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Search parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/marketers/{id}:
    get:
      operationId: getMarketerDetail
      summary: Get a marketer's detailed profile
      description: Returns the marketer profile, active service listings, completed-job count, and average rating. Completed jobs are matched through the marketer's accepted offers. The average uses only ratings from 1 to 5 and is null when no qualifying review exists.
      tags: [Marketers]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: Detailed marketer profile and verified performance summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketerDetailResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A creator profile or administrator role is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The marketer profile does not exist or belongs to a deleted user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/marketers/{id}/reviews:
    get:
      operationId: listMarketerReviews
      summary: List a marketer's verified reviews
      description: >-
        Lists reviews for Completed Jobs in which the marketer held the accepted
        Offer. Reviews have a rating from 1 to 5 and include the job owner's
        name. Results are newest first and paginated. average_rating and
        review_count cover all qualifying reviews. When no reviews qualify,
        items is empty, review_count is 0, and average_rating is null.
        The profile owner, Creators, and administrators can access this endpoint.
      tags: [Marketers]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: page
          in: query
          description: One-based page number.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Number of reviews per page.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: One page of verified reviews with the aggregate rating. items is an empty array and average_rating is null when none qualify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketerReviewsResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks Creator membership and administrator access and does not own this marketer profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The marketer profile does not exist or belongs to a deleted user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: page or page_size is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/surveys:
    post:
      operationId: createSurvey
      summary: Create a survey
      description: Creates a survey for the authenticated Creator. Registration provisions Creator membership immediately; this operation also uses an idempotent membership insert for existing or legacy accounts.
      tags: [Surveys]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSurveyRequest'
            example:
              title: Campus mobility survey
              survey_link: https://example.test/campus-mobility
              description: Collect student feedback about campus transportation.
              target_group: University students
              desired_responses: 50
      responses:
        '201':
          description: Survey created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyResponse'
        '401':
          description: Authentication is required or the token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/surveys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      operationId: getSurvey
      summary: Get a survey
