x-backend: &backend
  build: .
  image: ${COMPOSE_PROJECT_NAME}-backend:local

services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: cuway_container
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      POSTGRES_DB: ${POSTGRES_DB:-cuway_database}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    <<: *backend
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: &database-url "${COMPOSE_DATABASE_URL:-postgresql://${POSTGRES_USER:-myuser}:${POSTGRES_PASSWORD:-mypassword}@postgres:5432/${POSTGRES_DB:-cuway_database}?sslmode=disable}"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      APP_ENV: development
      PORT: "8081"
      DATABASE_URL: *database-url
      SECRET_KEY: "${SECRET_KEY:-cuways-compose-local-development-only}"
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_container
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-weakpassword}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
